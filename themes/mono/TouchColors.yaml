# tdtheme sparse overlay - only keys that differ from baseline.
# file: TouchColors
#
# "mono" - black and white. Not a dark theme, not a light theme: the same
# interface with the colour taken out. Every light/dark relationship, every
# contrast ratio and every deliberate state distinction survives, because each
# key keeps its own shipped brightness. What is gone is hue.
#
#   tdtheme apply mono         # switch to it
#   tdtheme apply default      # back to the stock look
#
# ---------------------------------------------------------------- method
#
# The default for every key is the Rec.709 luminance of its shipped RGB,
# rounded to two decimals:
#
#     L = 0.2126 R + 0.7152 G + 0.0722 B        worksheet.bg -> 0.11
#
# That single rule does most of the work, and it is why this theme is safe:
# luminance preserves ordering, so nothing that was brighter than something
# else stops being brighter. The result is 80 distinct tones across 626 keys -
# a scale, not a palette. It is deliberately not a palette; see below.
#
# The obvious alternative - snap everything to a fixed 10-step palette - was
# measured and rejected. The shipped file separates 82 state siblings by
# design (`parms.button.bg` 0.36 vs `.bg.loc` 0.42, plus `.sel`, `.off`,
# `.on`, `.disabled`, `.editing`, `.editable`), and 35 of those pairs differ
# by less than 0.06. A 10-step ramp collapses 33 of the 82 into a single
# tone; 12 steps still eats 31, and 24 steps still eats 20 - while looking
# like a palette rather than like the interface it is restyling. A quantizer
# that discards a third of the shipped state information is not a design, it
# is damage. So the ramp below is applied only where hue was genuinely
# carrying information, and nowhere else.
#
# ---------------------------------------------------------------- the ramp
#
# Node type base hues. Seven keys, evenly spaced 0.08 apart. Shipped
# luminance leaves them at 0.19 / 0.34 / 0.39 / 0.42 / 0.47 / 0.50 / 0.57 -
# six of the seven crowded into 0.34-0.57, which is not a palette, it is a
# smear. These are also the only seven node colours TouchDesigner stores;
# the highlight, low and icon shades of every node are derived from them by
# the sat/val multipliers in TouchOptions (see docs/parameter-reference.md
# 5.4), so all seven have to move together or the derived shades desync.
# They do here. The base colours are gray, so the .sat multipliers are a
# no-op and cannot reintroduce colour.
#
#   POP 0.18  DAT 0.26  MAT 0.34  CHOP 0.42  SOP 0.50  TOP 0.58  COMP 0.66
#
# Syntax highlighting. The shipped sets disagree with each other - python
# makes `strings` salmon and glsl makes it yellow, xml makes `attributes`
# blue and python has no such token. In grayscale those disagreements become
# arbitrary brightness differences. One ramp, applied by token role, across
# all five languages:
#
#   comments 0.45 < symbols 0.52 < attributevalues 0.58 < numbers/strings 0.68
#              < keywords/tags 0.80 < functions/attributes 0.92
#
# Editable / editing / noteditable also disagreed (dat.python makes `editing`
# dimmer than `editable`; textport makes it brighter). One order for the whole
# app: actively focused is brightest.
#
#   noteditable 0.48 < editable 0.68 < editing 0.85
#
# 3D axes. X / Y / Z were the only thing distinguishing them. Three tones,
# as far apart as three tones can be: X 0.92, Y 0.58, Z 0.26.
#
# CHOP graph bars. bar.0-2 ship as a gray ramp and are left untouched. bar.3-7
# are five identity colours - yellow, cyan, blue, pink, white - and luminance
# crushes them into 0.71-0.90, which is to say nearly the same grey five times.
# Spaced on the same 0.08 rhythm as the node types, continuing upward from
# bar.2:
#
#   bar.3 0.64  bar.4 0.72  bar.5 0.80  bar.6 0.88  bar.7 0.96
#
# CHOP aux curves. Shipped luminance puts aux2 (0.71) on top of aux3 (0.64).
# Four curves plus four marker tones, evenly spaced:
#
#   aux1 0.30  aux2 0.48  aux3 0.66  aux4 0.84
#   mark 0.38  mark 0.56  mark 0.74  mark 0.92
#
# ---------------------------------------------------------------- state
#
# Error is the one place the luminance rule had to be overridden rather than
# followed. Pure red has a luminance of 0.213, so mechanically it becomes a
# dark grey mark on a black tile - the exact opposite of what red was doing.
# Errors here are the brightest thing in the theme (0.95) on the assumption
# that the reason red was red was to be noticed, and brightness is the only
# channel left to notice it with. Warning sits below at 0.78 so the two never
# compete. Cook/live state is 0.72.
#
# What is genuinely lost, and no value fixes it: error, selection and
# "this row is special" are all brightness in a grayscale theme. tile.error
# and a selected tile are now told apart by tone alone, so treat the brightest
# mark in the network editor as "check this" rather than assuming it is an
# error.
#
# ---------------------------------------------------------------- exceptions
#
# Four keys stay coloured on purpose:
#
#   ramp.red  ramp.green  ramp.blue  ramp.saturation
#
# These are the identity of a hue channel in the Ramp node's colour picker,
# not decoration. A grey "red ramp" cannot be told from a grey "green ramp",
# so desaturating them breaks the control rather than restyling it. This is
# the one place in the theme where hue is information, and the reason a
# black-and-white TouchDesigner is 622 of 626 keys, not 626.
#
# ---------------------------------------------------------------- caveats
#
# This theme is deliberately close to total: 460 of 626 keys, against 20 for
# midnight and 17 for sunset. A full desaturation has no small version, and
# pretending otherwise would leave the interface half coloured.
#
# The cost is the usual sparse-overlay trade-off, in reverse. A sparse theme
# inherits keys a future TouchDesigner adds; this one cannot, because it
# cannot desaturate a key it has never heard of. After a TouchDesigner update
# that adds colour keys, expect new keys to arrive coloured and the theme to
# need regenerating against the new baseline (`tdtheme capture --force`).
#
# No TouchOptions changes. The sat/val multipliers need no adjustment because
# a gray base stays gray under any saturation multiplier, and the blendtype
# enum is still undecoded (docs/parameter-reference.md 5.2) - not worth
# guessing at for a theme that does not need it.
#
# ---------------------------------------------------------------- siblings
#
# `bnw` is a later pass at the same brief, and the two are not
# interchangeable. This theme desaturates without brightening: each key keeps
# its own shipped luminance, so the vendor's light/dark ordering survives
# intact and every state sibling stays distinct - at the cost of needing 80
# tones, which is a scale rather than a palette. `bnw` is the opposite
# trade: 16 tones, hierarchy carried by inversion, closer to black and white
# in the sense that most keys are. If the interface looks too grey, use
# `bnw`; if something in it went missing, use this one.
#

