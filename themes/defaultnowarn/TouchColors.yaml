# tdtheme sparse overlay - only keys that differ from baseline.
# file: TouchColors
#
# defaultnowarn is a CUSTOM theme. It is not `default`, it is not a reset
# theme, and it is not stock TouchDesigner. Read this before assuming
# otherwise - an earlier version of this file was copied from `default/` and
# described *that* theme, which is how this warning exists.
#
# What it is: `default`, with one icon blanked.
#
# This file and TouchOptions.yaml are both empty overlays, inherited from the
# copy. So the colours and options this theme applies are the untouched
# baseline - identical to `default`, key for key. That is deliberate.
#
# The entire difference between this theme and `default` is one file:
#
#     Icons/WarnFace.tiff    64x64 RGBA, every decoded byte zero
#
# `default`'s copy of that icon draws a warning face (4138 non-zero bytes).
# This one is blank, so the glyph never renders and the warning face is gone
# from the UI. The other 96 icons are byte-identical to `default`.
#
# In practice:
#
#     apply default         stock colours, stock options, warning face shown
#     apply defaultnowarn   stock colours, stock options, warning face hidden
#
# Neither undoes a theme. This one is a small, deliberate change to the stock
# look, made because the warning face is noise for anyone who is not looking
# for it.
#
# Two things not to "fix":
#
#   - The empty overlay is correct. Filling it in would make this theme
#     override colours it has no opinion about.
#   - The icons must not be rebuilt from the recipe. See
#     tdthememaker/recipes/defaultnowarn.recipe.json: it has no ops *on
#     purpose*, because a recipe cannot express "this pixel is zero". Building
#     it would silently put the stock warning face back. `build --check`
#     refuses and names WarnFace.tiff; `build` needs an explicit --force.
#
# This header is hand-written. Re-exporting the theme
# (`python3 -m tdthememaker.cli export defaultnowarn --force`) rewrites these
# files with a three-line generated header and loses everything above.
