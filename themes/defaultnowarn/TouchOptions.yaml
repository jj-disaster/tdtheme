# tdtheme sparse overlay - only keys that differ from baseline.
# file: TouchOptions
#
# Intentionally empty - see TouchColors.yaml in this folder, which is the
# canonical description of this theme.
#
# The short version, because this file is the one most likely to be read on
# its own: defaultnowarn is a custom theme, not `default`. It differs from
# `default` by exactly one file, Icons/WarnFace.tiff, which is blank so the
# warning-face glyph does not render. The option keys are untouched, exactly as
# in `default`, so there is nothing to override here.
#
# The same caveat as the stock theme applies: `capture` snapshots the install
# as it is, so `capture --force` taken while TouchDesigner has unsaved UI
# changes would redefine the baseline this empty overlay resolves against.
# `./tdtheme status` shows whether the baseline still matches the install.
