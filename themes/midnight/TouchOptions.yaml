# tdtheme sparse overlay - only keys that differ from baseline.
# file: TouchOptions
#
# "midnight" currently changes colours only, so this file is empty.
# TouchOptions holds numeric UI options - sizing, spacing, alpha.
#
# Two rules matter if you edit this file:
#   * tile.*.size and tile.*.origsize must stay > 0. A zero collapses
#     connectors and borders with no error from TouchDesigner, so
#     `tdtheme apply` refuses it.
#   * font.relative.size is 0 in the shipped file and that is correct -
#     it is a delta, not an absolute size.
#
